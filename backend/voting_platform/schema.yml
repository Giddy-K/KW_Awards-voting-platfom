          type: string
        expires_in:
          type: integer
          description: Lifetime in seconds.
      required:
      - expires_in
      - token
      - token_type
  securitySchemes:
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Staff access token from `POST /api/v1/auth/token/`. Send as `Authorization:
        Bearer <access token>`. Voter tokens are not accepted.'
    voterOrStaffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`POST /votes/` and `GET /votes/mine/` need a **voter token** (from
        `/voters/otp/verify/`); listing, reading and voiding votes need a **staff
        JWT** with the EventAdmin role.'
