      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - closed
          - draft
          - nominations_open
          - results_published
          - voting_open
        description: |-
          * `draft` - Draft
          * `nominations_open` - Nominations open
          * `voting_open` - Voting open
          * `closed` - Closed
          * `results_published` - Results published
