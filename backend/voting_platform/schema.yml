    post:
      operationId: voters_otp_request_create
      description: Ask for an SMS code. The response is identical whether or not the
        number is known.
      tags:
      - voters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/voters/otp/verify/:
    post:
      operationId: voters_otp_verify_create
      description: Exchange the SMS code for a short-lived voter token.
      tags:
      - voters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoterToken'
          description: ''
  /api/v1/votes/:
    get:
      operationId: votes_list
      description: |-
        Voters cast votes here; event admins review and void them.

        One URL serves both audiences, so authentication accepts either token type and each action
        names the permission it needs: ``create`` and ``mine`` need a *voter* token, everything else
        needs the *EventAdmin* role.
      parameters:
      - in: query
        name: award
        schema:
          type: string
          format: uuid
      - in: query
        name: event
        schema:
          type: string
      - in: query
        name: nomination
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: phone
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - free
          - paid
        description: |-
          * `free` - Free
          * `paid` - Paid
      - in: query
        name: voided
        schema:
          type: boolean
      tags:
      - votes
      security:
      - voterOrStaffAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffVoteList'
          description: ''
    post:
      operationId: votes_create
      description: Cast a free vote for a nomination (one per award; 409 if you already
        voted).
      tags:
      - votes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteCastRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoteCastRequest'
        required: true
      security:
      - voterOrStaffAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteReceipt'
          description: ''
  /api/v1/votes/{id}/:
    get:
      operationId: votes_retrieve
      description: |-
        Voters cast votes here; event admins review and void them.

        One URL serves both audiences, so authentication accepts either token type and each action
        names the permission it needs: ``create`` and ``mine`` need a *voter* token, everything else
        needs the *EventAdmin* role.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this vote.
        required: true
      tags:
      - votes
      security:
      - voterOrStaffAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffVote'
          description: ''
  /api/v1/votes/{id}/void/:
    post:
      operationId: votes_void_create
      description: Exclude a vote from all tallies (event admins). The row is kept.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this vote.
        required: true
      tags:
      - votes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoidRequest'
        required: true
      security:
      - voterOrStaffAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffVote'
          description: ''
  /api/v1/votes/mine/:
    get:
      operationId: votes_mine_list
      description: Which awards the authenticated voter has voted in (no tallies).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - votes
      security:
      - voterOrStaffAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyVoteList'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      description: 'What login/refresh return: the access token only. The refresh
        token is a cookie.'
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    AuditActionEnum:
      enum:
      - nomination.submitted
      - nomination.approved
      - nomination.rejected
      - vote.cast
      - vote.duplicate
      - vote.voided
      - otp.requested
      - otp.verified
      - otp.failed
      - event.status_changed
      - staff.login
      - staff.login_failed
      - permission.denied
      - sms.budget_exhausted
      type: string
      description: |-
        * `nomination.submitted` - Nomination submitted
        * `nomination.approved` - Nomination approved
        * `nomination.rejected` - Nomination rejected
        * `vote.cast` - Vote cast
        * `vote.duplicate` - Duplicate vote rejected
        * `vote.voided` - Vote voided
        * `otp.requested` - OTP requested
        * `otp.verified` - OTP verified
        * `otp.failed` - OTP verification failed
        * `event.status_changed` - Event status changed
        * `staff.login` - Staff login
        * `staff.login_failed` - Staff login failed
        * `permission.denied` - Permission denied
        * `sms.budget_exhausted` - SMS daily budget exhausted
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/AuditActionEnum'
          readOnly: true
        actor_user:
          type: string
          format: email
          readOnly: true
        actor_voter:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_user
      - actor_voter
      - created_at
      - id
      - ip_address
      - metadata
      - target_id
      - target_type
      - user_agent
    Award:
      type: object
      description: |-
        Store selected string fields as plain text (tags and control characters removed).

        List field names in ``plain_text_fields`` (single line) and ``multiline_fields``
        (newlines kept). A required field that becomes empty after cleaning is rejected.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
          format: uuid
        event:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 1000
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - event
      - id
      - name
      - slug
      - updated_at
    AwardRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          type: object
          additionalProperties: {}
          readOnly: true
        event:
          type: string
          readOnly: true
      required:
      - category
      - event
      - id
      - name
      - slug
    AwardRequest:
      type: object
      description: |-
        Store selected string fields as plain text (tags and control characters removed).

        List field names in ``plain_text_fields`` (single line) and ``multiline_fields``
        (newlines kept). A required field that becomes empty after cleaning is rejected.
      properties:
        category:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 1000
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
      required:
      - category
      - name
      - slug
    Category:
      type: object
      description: 'Adds ``awards`` to a category: active ones only unless the viewer
        is an event admin.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 1000
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
        awards:
          type: array
          items:
            $ref: '#/components/schemas/NestedAward'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - awards
      - created_at
      - event
      - id
      - name
      - slug
      - updated_at
    CategoryRequest:
      type: object
      description: 'Adds ``awards`` to a category: active ones only unless the viewer
        is an event admin.'
      properties:
