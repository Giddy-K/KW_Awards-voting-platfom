          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/StaffVote'
    PatchedAwardRequest:
      type: object
      description: |-
        Store selected string fields as plain text (tags and control characters removed).

        List field names in ``plain_text_fields`` (single line) and ``multiline_fields``
        (newlines kept). A required field that becomes empty after cleaning is rejected.
      properties:
        category:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 1000
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
    PatchedCategoryRequest:
      type: object
      description: 'Adds ``awards`` to a category: active ones only unless the viewer
        is an event admin.'
      properties:
        event:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 1000
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
    PatchedEventRequest:
      type: object
      description: Events. ``status`` is read-only here; change it with ``POST .../set-status/``.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
