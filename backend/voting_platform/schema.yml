openapi: 3.0.3
info:
  title: KW Awards Voting Platform API
  version: 1.0.0
  description: Public read endpoints, phone-verified voting and staff administration
    for the KW Awards. Staff authenticate with a JWT (`/api/v1/auth/token/`); voters
    with a short-lived voter token issued by `/api/v1/voters/otp/verify/`.
paths:
  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Read-only audit trail for dispute resolution (event admins). Entries
        cannot be changed.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - event.status_changed
          - nomination.approved
          - nomination.rejected
          - nomination.submitted
          - otp.failed
          - otp.requested
          - otp.verified
          - permission.denied
          - sms.budget_exhausted
          - staff.login
          - staff.login_failed
          - vote.cast
          - vote.duplicate
          - vote.voided
        description: |-
          * `nomination.submitted` - Nomination submitted
          * `nomination.approved` - Nomination approved
          * `nomination.rejected` - Nomination rejected
          * `vote.cast` - Vote cast
          * `vote.duplicate` - Duplicate vote rejected
          * `vote.voided` - Vote voided
          * `otp.requested` - OTP requested
          * `otp.verified` - OTP verified
          * `otp.failed` - OTP verification failed
          * `event.status_changed` - Event status changed
          * `staff.login` - Staff login
          * `staff.login_failed` - Staff login failed
          * `permission.denied` - Permission denied
          * `sms.budget_exhausted` - SMS daily budget exhausted
      - in: query
        name: actor_user
        schema:
          type: string
          format: uuid
      - in: query
        name: actor_voter
        schema:
          type: string
          format: uuid
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - audit-logs
      security:
      - staffAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: Read-only audit trail for dispute resolution (event admins). Entries
        cannot be changed.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audit log.
        required: true
      tags:
      - audit-logs
      security:
      - staffAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist the caller's refresh token (read from the cookie) and
        clear the cookie.
      parameters:
      - in: header
        name: X-Requested-With
        schema:
          type: string
        description: Must be exactly "XMLHttpRequest". A lightweight CSRF check for
          this cookie-setting/reading endpoint; see HasAjaxHeader.
        required: true
      tags:
      - auth
      security:
      - staffAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The authenticated staff member and their roles.
      tags:
      - auth
      security:
      - staffAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Exchange the refresh cookie for a new access token. Refresh tokens rotate.

        The refresh token is read from the cookie set by login (never from the request body);
        the response sets a new rotated cookie and returns only the access token.
      parameters:
      - in: header
        name: X-Requested-With
        schema:
          type: string
        description: Must be exactly "XMLHttpRequest". A lightweight CSRF check for
          this cookie-setting/reading endpoint; see HasAjaxHeader.
        required: true
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Staff login. There is no public signup: accounts are created by an administrator.

        The refresh token is set as an HttpOnly cookie (never in the response body); only the
        access token is returned.
      parameters:
      - in: header
        name: X-Requested-With
        schema:
          type: string
        description: Must be exactly "XMLHttpRequest". A lightweight CSRF check for
          this cookie-setting/reading endpoint; see HasAjaxHeader.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
