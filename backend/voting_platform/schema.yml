        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        year:
          type: integer
          maximum: 2100
          minimum: 2000
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          readOnly: true
        nominations_open_at:
          type: string
          format: date-time
          nullable: true
        nominations_close_at:
          type: string
          format: date-time
          nullable: true
        voting_opens_at:
          type: string
          format: date-time
          nullable: true
        voting_closes_at:
          type: string
          format: date-time
          nullable: true
        results_published_at:
          type: string
