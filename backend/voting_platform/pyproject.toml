[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "voting_platform.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, C4 comprehensions
select = ["E", "F", "W", "I", "B", "UP", "C4"]
# Line length is enforced by `ruff format`; long strings/comments are left alone.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Django settings idiom: star-imports from the base settings module.
"voting_platform/settings/*.py" = ["F403", "F405", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "audit", "common", "events", "nominations", "payments", "voting", "voting_platform", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["accounts", "audit", "common", "events", "nominations", "payments", "voting"]
omit = ["*/migrations/*", "*/tests/*"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
fail_under = 90
