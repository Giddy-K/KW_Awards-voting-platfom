name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/voting_platform

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vote_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test/dev database (matches the service above). Not a real secret.
      DB_NAME: vote_app
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/voting_platform/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt -r requirements/prod.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Django system check (dev settings)
        run: python manage.py check

      - name: Django deployment check (prod settings, dummy env)
        env:
          DJANGO_SETTINGS_MODULE: voting_platform.settings.prod
          # Throwaway values used only to satisfy the required production settings.
          SECRET_KEY: ci-only-dummy-key-7Qm4vBpZ2rLk9tWc8Yn3Ds6HgJf0aEu1oIiXyVbN5MqTzR
          # Must differ from SECRET_KEY -- prod refuses to start otherwise (Phase 2.3).
          AUDIT_PHONE_HASH_KEY: ci-only-dummy-audit-key-9wAqX4sMp7uVe1Zr6Ct8FgKh3dRy5oLi
          ALLOWED_HOSTS: vote.example.com
          FRONTEND_URL: https://vote.example.com
          CORS_ALLOWED_ORIGINS: https://vote.example.com
          CSRF_TRUSTED_ORIGINS: https://vote.example.com
          CACHE_URL: redis://localhost:6379/1
          AFRICASTALKING_USERNAME: ci-dummy
          AFRICASTALKING_API_KEY: ci-dummy
          TURNSTILE_SECRET_KEY: ci-dummy
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: OpenAPI schema is valid and up to date
        run: |
          python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn
          diff --strip-trailing-cr schema.yml /tmp/schema.yml \
            || (echo "schema.yml is stale: run 'python manage.py spectacular --file schema.yml' and commit it" && exit 1)

      - name: Tests (with coverage)
        run: pytest

      - name: Dependency audit (pip-audit)
        run: pip-audit
