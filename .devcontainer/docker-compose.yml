services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  # The shared cache the throttles need (see AUDIT.md "Phase 2.1 results" for why a live
  # Redis run wasn't possible in the audit's own Windows dev environment). Shares db's
  # network namespace, like `app` does, so it's reachable at localhost:6379 from `app`.
  # Set CACHE_URL=redis://localhost:6379/1 to use it (see backend/voting_platform/.env.example).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: service:db

    # Add "forwardPorts": ["6379"] to **devcontainer.json** to forward Redis locally.

volumes:
  postgres-data:
